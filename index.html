<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon École Magique CP</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FF6B6B; --secondary: #4ECDC4; --accent: #FFE66D; --bg: #E0F7FA; }
        body { font-family: 'Varela Round', sans-serif; background-color: var(--bg); margin: 0; text-align: center; color: #2C3E50; }
        
        nav { background: white; padding: 15px; display: flex; justify-content: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        nav button { padding: 12px 25px; font-size: 1.2rem; border: none; border-radius: 50px; cursor: pointer; background: #f0f0f0; transition: 0.3s; font-family: inherit; }
        nav button.active { background: var(--primary); color: white; transform: scale(1.1); box-shadow: 0 4px 0 #d64545; }

        .container { max-width: 650px; margin: 30px auto; padding: 30px; background: white; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        
        .info-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #7F8C8D; }
        .progress-container { width: 100%; background: #eee; height: 15px; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { background: var(--secondary); height: 100%; width: 0%; transition: 0.5s; }

        .math-box { font-size: 6rem; margin: 20px 0; font-weight: bold; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .btn-choice { padding: 25px; font-size: 2.8rem; border-radius: 25px; border: 4px solid #F5F5F5; background: white; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn-choice:hover { border-color: var(--secondary); }
        .btn-choice.correct { background: #27AE60 !important; color: white; border-color: #27AE60; }
        .btn-choice.wrong { background: #E74C3C !important; color: white; border-color: #E74C3C; }
        
        .btn-main { background: #27AE60; color: white; padding: 15px 40px; font-size: 1.6rem; border: none; border-radius: 25px; cursor: pointer; margin-top: 20px; font-family: inherit; }
        .btn-stop { background: #E74C3C; color: white; padding: 15px 30px; border: none; border-radius: 20px; cursor: pointer; margin-top: 20px; font-family: inherit; }
        .feedback { font-size: 2.2rem; height: 60px; font-weight: bold; margin: 10px 0; }
        .btn-audio { font-size: 5rem; background: var(--secondary); color: white; border-radius: 50%; width: 120px; height: 120px; border: none; cursor: pointer; box-shadow: 0 8px 0 #39a39a; margin: 20px; }
    </style>
</head>
<body>

    <nav>
        <button id="nav-math" onclick="goTo('math')" class="active">🔢 Calculs</button>
        <button id="nav-dictation" onclick="goTo('dictation')">✍️ Dictée</button>
        <button id="nav-words" onclick="goTo('words')">📝 Mes Mots</button>
    </nav>

    <div id="view-math" class="container">
        <div id="math-setup">
            <h1>Tables d'Additions</h1>
            <p>Choisis ta table :</p>
            <input type="number" id="math-table" value="2" min="0" max="10" style="font-size: 3rem; width: 100px; text-align: center; border-radius: 15px; border: 3px solid var(--secondary);">
            <br><br>
            <button class="btn-main" onclick="startMath()">COMMENCER</button>
        </div>

        <div id="math-game" class="hidden">
            <div class="info-bar">
                <span>Question <span id="q-idx">1</span> / 10</span>
                <span>Score: <span id="q-score">0</span></span>
            </div>
            <div class="progress-container"><div id="m-progress" class="progress-bar"></div></div>
            <div id="math-q" class="math-box"></div>
            <div id="math-opts" class="btn-grid"></div>
            <div id="math-fb" class="feedback"></div>
        </div>

        <div id="math-end" class="hidden">
            <h1 style="font-size: 3rem;">Fini ! 🏆</h1>
            <div style="font-size: 5rem; color: #F1C40F;"><span id="final-math-score">0</span> / 10</div>
            <button class="btn-main" onclick="goTo('math')">REJOUER</button>
        </div>
    </div>

    <div id="view-dictation" class="container hidden">
        <div id="dict-setup">
            <h1>Dictée Détective</h1>
            <p>Choisis ton exercice :</p>
            <button class="btn-choice" style="width:100%; font-size:1.5rem;" onclick="startDict('LA')">Syllabe LA</button>
            <button class="btn-choice" style="width:100%; font-size:1.5rem; margin: 10px 0;" onclick="startDict('MA')">Syllabe MA</button>
            <button class="btn-choice" style="width:100%; font-size:1.5rem;" onclick="startDict('CH')">Son CH 🐱</button>
            <div id="custom-lists-divider" class="hidden" style="margin: 20px 0; border-top: 2px dashed #ccc;"></div>
            <div id="custom-lists-buttons"></div>
        </div>
        <div id="dict-game" class="hidden">
            <div style="font-weight: bold; color: var(--primary);">Mot <span id="d-idx-display">1</span> / 3</div>
            <button class="btn-audio" onclick="sayWord()">🔊</button>
            <p>Écoute bien et écris le mot.</p>
            <button class="btn-main" id="btn-next-d" onclick="nextWord()">MOT SUIVANT ➡️</button>
            <br>
            <button class="btn-stop" id="btn-fini-d" onclick="finishDict()">J'AI FINI !</button>
            
            <div id="dict-res" class="hidden" style="margin-top:20px; padding:20px; border:3px dashed #4ECDC4; border-radius:20px;">
                <h3 style="color: #27AE60;">Correction :</h3>
                <p id="dict-list" style="font-size:2.2rem; font-weight:bold; color:var(--primary); letter-spacing: 2px;"></p>
                <button class="btn-main" style="background:#34495E" onclick="goTo('dictation')">RETOUR AU MENU</button>
            </div>
        </div>
    </div>

    <div id="view-words" class="container hidden">
        <div id="words-setup">
            <h1>📝 Mes Listes de Mots</h1>
            <p>Crée et gère tes propres listes de mots !</p>
            <button class="btn-main" onclick="showCreateList()">➕ Nouvelle Liste</button>
            
            <div id="saved-lists" style="margin-top: 30px;"></div>
        </div>

        <div id="words-editor" class="hidden">
            <h2 id="editor-title">Nouvelle Liste</h2>
            <input type="text" id="list-name" placeholder="Nom de la liste" style="font-size: 1.5rem; width: 80%; padding: 10px; border-radius: 15px; border: 3px solid var(--secondary); margin-bottom: 20px;">
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <input type="text" id="new-word" placeholder="Ajouter un mot" style="font-size: 1.3rem; padding: 10px; border-radius: 15px; border: 3px solid var(--primary); width: 200px;">
                <button class="btn-main" style="padding: 10px 20px; font-size: 1.2rem; margin-top: 0;" onclick="addWordToList()">Ajouter</button>
            </div>
            
            <div id="words-list" style="text-align: left; margin: 20px 0; max-height: 300px; overflow-y: auto;"></div>
            
            <button class="btn-main" onclick="saveCustomList()">💾 Sauvegarder</button>
            <button class="btn-stop" onclick="goTo('words')">Annuler</button>
        </div>
    </div>

    <script>
        var mScore = 0, mIdx = 0, mAns = 0, canClick = true;
        var mathQuestions = [];
        var googleVoice = null;

        function loadVoices() {
            var voices = window.speechSynthesis.getVoices();
            googleVoice = voices.find(function(v) { return v.lang.startsWith('fr-FR'); }) || 
                          voices.find(function(v) { return v.lang.startsWith('fr'); });
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function speak(t) {
            window.speechSynthesis.cancel();
            var msg = new SpeechSynthesisUtterance(t);
            msg.lang = 'fr-FR';
            if(googleVoice) msg.voice = googleVoice;
            msg.rate = 0.7;
            window.speechSynthesis.speak(msg);
        }

        function goTo(v) {
            document.querySelectorAll('.container').forEach(function(c) { c.classList.add('hidden'); });
            document.querySelectorAll('nav button').forEach(function(b) { b.classList.remove('active'); });
            if(v === 'math') {
                document.getElementById('view-math').classList.remove('hidden');
                document.getElementById('math-setup').classList.remove('hidden');
                document.getElementById('math-game').classList.add('hidden');
                document.getElementById('math-end').classList.add('hidden');
                document.getElementById('nav-math').classList.add('active');
            } else if(v === 'dictation') {
                document.getElementById('view-dictation').classList.remove('hidden');
                document.getElementById('dict-setup').classList.remove('hidden');
                document.getElementById('dict-game').classList.add('hidden');
                document.getElementById('nav-dictation').classList.add('active');
            } else if(v === 'words') {
                document.getElementById('view-words').classList.remove('hidden');
                document.getElementById('words-setup').classList.remove('hidden');
                document.getElementById('words-editor').classList.add('hidden');
                document.getElementById('nav-words').classList.add('active');
                loadCustomLists();
            }
        }

        // MATH LOGIC - Fixed to show table+1 to table+10 in random order
        function startMath() {
            mScore = 0;
            mIdx = 0;
            var table = parseInt(document.getElementById('math-table').value) || 0;
            
            // Generate all 10 questions (table + 1 to table + 10), then shuffle
            mathQuestions = [];
            for(var i = 1; i <= 10; i++) {
                mathQuestions.push({ a: table, b: i, ans: table + i });
            }
            // Shuffle the questions
            mathQuestions.sort(function() { return Math.random() - 0.5; });
            
            document.getElementById('math-setup').classList.add('hidden');
            document.getElementById('math-game').classList.remove('hidden');
            newMathQ();
        }

        function newMathQ() {
            if(mIdx >= 10) { showMathEnd(); return; }
            mIdx++;
            canClick = true;
            document.getElementById('q-idx').innerText = mIdx;
            document.getElementById('q-score').innerText = mScore;
            document.getElementById('m-progress').style.width = (mIdx * 10) + "%";
            document.getElementById('math-fb').innerText = "";

            var q = mathQuestions[mIdx - 1];
            mAns = q.ans;
            document.getElementById('math-q').innerText = q.a + " + " + q.b;

            // Generate wrong answers (close to correct answer)
            var opts = new Set([mAns]);
            while(opts.size < 3) {
                var offset = Math.floor(Math.random() * 5) - 2;
                if(offset === 0) offset = Math.random() > 0.5 ? 1 : -1;
                var f = mAns + offset;
                if(f >= 0 && f !== mAns) opts.add(f);
            }

            var grid = document.getElementById('math-opts');
            grid.innerHTML = "";
            Array.from(opts).sort(function() { return Math.random() - 0.5; }).forEach(function(n) {
                var b = document.createElement('button');
                b.className = 'btn-choice';
                b.innerText = n;
                b.onclick = function(e) { checkMath(n, e.target); };
                grid.appendChild(b);
            });
        }

        function checkMath(n, btn) {
            if(!canClick) return;
            canClick = false;
            if(n === mAns) {
                mScore++;
                btn.classList.add('correct');
                document.getElementById('math-fb').innerText = "🌟 BRAVO !";
                speak("Bravo !");
            } else {
                btn.classList.add('wrong');
                document.getElementById('math-fb').innerText = "Dommage !";
                speak("Non, la réponse était " + mAns);
                Array.from(document.querySelectorAll('.btn-choice')).forEach(function(b) {
                    if(parseInt(b.innerText) === mAns) b.classList.add('correct');
                });
            }
            setTimeout(newMathQ, 2000);
        }

        function showMathEnd() {
            document.getElementById('math-game').classList.add('hidden');
            document.getElementById('math-end').classList.remove('hidden');
            document.getElementById('final-math-score').innerText = mScore;
            speak("C'est fini ! Tu as eu " + mScore + " sur dix.");
        }

        // DICTATION LOGIC
        var dW = [], dI = 0;
        var db = {'LA':["UN LAMA","LE LAVABO","LA LAPINE"], 'MA':["MAMAN","UNE MAMIE","LE MATIN"], 'CH':["UN CHAT","UNE VACHE","RICHE"]};
        
        function startDict(k) {
            if(k.indexOf('CUSTOM:') === 0) {
                var listId = parseInt(k.replace('CUSTOM:', ''));
                var customList = customWordLists.find(function(l) { return l.id === listId; });
                if(customList) {
                    dW = customList.words;
                }
            } else {
                dW = db[k];
            }
            dI = 0;
            document.getElementById('dict-setup').classList.add('hidden');
            document.getElementById('dict-game').classList.remove('hidden');
            document.getElementById('dict-res').classList.add('hidden');
            document.getElementById('btn-next-d').classList.remove('hidden');
            document.getElementById('btn-fini-d').classList.remove('hidden');
            updateDictUI();
            sayWord();
        }
        
        function updateDictUI() {
            document.getElementById('d-idx-display').innerText = dI + 1;
        }

        function sayWord() { 
            speak(dW[dI]); 
        }

        function nextWord() {
            if(dI < dW.length - 1) { 
                dI++; 
                updateDictUI();
                sayWord(); 
            } else { 
                finishDict();
            }
        }

        function finishDict() {
            document.getElementById('btn-next-d').classList.add('hidden');
            document.getElementById('btn-fini-d').classList.add('hidden');
            document.getElementById('dict-res').classList.remove('hidden');
            document.getElementById('dict-list').innerText = dW.join("  -  ");
            speak("Travail terminé ! Voici la correction.");
        }

        // CUSTOM WORD LISTS
        var customWordLists = [];
        var currentEditingList = null;
        var tempWords = [];

        function loadCustomLists() {
            var stored = localStorage.getItem('customWordLists');
            if(stored) {
                customWordLists = JSON.parse(stored);
            }
            renderCustomListButtons();
            renderSavedLists();
        }

        function saveCustomListsToStorage() {
            localStorage.setItem('customWordLists', JSON.stringify(customWordLists));
            renderCustomListButtons();
            renderSavedLists();
        }

        function renderCustomListButtons() {
            var container = document.getElementById('custom-lists-buttons');
            var divider = document.getElementById('custom-lists-divider');
            
            if(customWordLists.length === 0) {
                container.innerHTML = '';
                divider.classList.add('hidden');
                return;
            }
            
            divider.classList.remove('hidden');
            container.innerHTML = customWordLists.map(function(list) {
                return '<button class="btn-choice" style="width:100%; font-size:1.2rem; margin: 5px 0;" onclick="startDict(\'CUSTOM:' + list.id + '\')">📝 ' + list.name + '</button>';
            }).join('');
        }

        function renderSavedLists() {
            var container = document.getElementById('saved-lists');
            
            if(customWordLists.length === 0) {
                container.innerHTML = '<p style="color: #7F8C8D; font-style: italic;">Aucune liste enregistrée. Crée ta première liste !</p>';
                return;
            }
            
            container.innerHTML = customWordLists.map(function(list) {
                return '<div style="background: #f8f8f8; border-radius: 15px; padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">' +
                    '<div style="flex: 1;">' +
                    '<strong style="font-size: 1.3rem;">' + list.name + '</strong>' +
                    '<br><span style="color: #7F8C8D; font-size: 0.9rem;">' + list.words.length + ' mots</span>' +
                    '</div>' +
                    '<div style="display: flex; gap: 8px;">' +
                    '<button class="btn-choice" style="padding: 8px 15px; font-size: 1rem; background: var(--secondary); color: white; border: none;" onclick="editList(' + list.id + ')">✏️</button>' +
                    '<button class="btn-choice" style="padding: 8px 15px; font-size: 1rem; background: #E74C3C; color: white; border: none;" onclick="deleteList(' + list.id + ')">🗑️</button>' +
                    '</div></div>';
            }).join('');
        }

        function showCreateList() {
            currentEditingList = null;
            tempWords = [];
            document.getElementById('editor-title').innerText = 'Nouvelle Liste';
            document.getElementById('list-name').value = '';
            document.getElementById('new-word').value = '';
            document.getElementById('words-setup').classList.add('hidden');
            document.getElementById('words-editor').classList.remove('hidden');
            renderTempWords();
        }

        function editList(id) {
            var list = customWordLists.find(function(l) { return l.id === id; });
            if(list) {
                currentEditingList = list;
                tempWords = list.words.slice();
                document.getElementById('editor-title').innerText = 'Modifier la liste';
                document.getElementById('list-name').value = list.name;
                document.getElementById('new-word').value = '';
                document.getElementById('words-setup').classList.add('hidden');
                document.getElementById('words-editor').classList.remove('hidden');
                renderTempWords();
            }
        }

        function deleteList(id) {
            if(confirm('Voulez-vous vraiment supprimer cette liste ?')) {
                customWordLists = customWordLists.filter(function(l) { return l.id !== id; });
                saveCustomListsToStorage();
            }
        }

        function addWordToList() {
            var input = document.getElementById('new-word');
            var word = input.value.trim().toUpperCase();
            
            if(word) {
                tempWords.push(word);
                input.value = '';
                renderTempWords();
                input.focus();
            }
        }

        function removeTempWord(index) {
            tempWords.splice(index, 1);
            renderTempWords();
        }

        function renderTempWords() {
            var container = document.getElementById('words-list');
            
            if(tempWords.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7F8C8D; font-style: italic;">Aucun mot ajouté. Tape un mot et clique sur "Ajouter" !</p>';
                return;
            }
            
            container.innerHTML = tempWords.map(function(word, index) {
                return '<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f0f0f0; border-radius: 10px; margin: 5px 0;">' +
                    '<span style="font-size: 1.4rem; font-weight: bold;">' + word + '</span>' +
                    '<button onclick="removeTempWord(' + index + ')" style="background: #E74C3C; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">✕</button>' +
                    '</div>';
            }).join('');
        }

        function saveCustomList() {
            var name = document.getElementById('list-name').value.trim();
            
            if(!name) {
                alert('Donne un nom à ta liste !');
                return;
            }
            
            if(tempWords.length === 0) {
                alert('Ajoute au moins un mot !');
                return;
            }
            
            if(currentEditingList) {
                currentEditingList.name = name;
                currentEditingList.words = tempWords.slice();
            } else {
                var newId = Date.now();
                customWordLists.push({
                    id: newId,
                    name: name,
                    words: tempWords.slice()
                });
            }
            
            saveCustomListsToStorage();
            goTo('words');
        }

        window.onload = function() {
            loadCustomLists();
        };

        document.addEventListener('keypress', function(e) {
            if(e.target.id === 'new-word' && e.key === 'Enter') {
                addWordToList();
            }
        });
    </script>
</body>
</html>
